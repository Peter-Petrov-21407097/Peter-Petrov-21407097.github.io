<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <h1>Loja</h1>

      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="../index.html">Página principal</a></li>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>

        <label for="filtro-categoria">Filtrar:</label>
        <select id="filtro-categoria">
          <option value="todas">Todas as categorias</option>
        </select>

        <label for="ordenar">Ordenar:</label>
        <select id="ordenar">
          <option value="default">Ordenar pelo preço</option>
          <option value="asc">Preço crescente</option>
          <option value="desc">Preço decrescente</option>
        </select>

        <label for="pesquisa">Procurar:</label>
        <input type="text" id="pesquisa" placeholder="pesquise por produto" />

        <div id="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Cesto de compras</h2>
        <p>Produtos no cesto: <span id="total-cesto">0</span></p>
        <ul id="lista-cesto"></ul>
        <p>Total: <strong id="preco-total">0,00 €</strong></p>
        <button id="limpar-cesto" type="button">Limpar cesto</button>

        <h3>Finalizar compra</h3>

        <label for="nome-cliente">Nome:</label>
        <input type="text" id="nome-cliente" placeholder="O seu nome" />

        <label for="estudante">Sou estudante:</label>
        <input type="checkbox" id="estudante" />

        <label for="cupao">Cupão de desconto:</label>
        <input type="text" id="cupao" placeholder="Código do cupão" />

        <button id="finalizar-compra" type="button">Finalizar compra</button>

        <p id="mensagem-compra" aria-live="polite"></p>
      </section>
    </main>

    <footer>
      <p>© 2026 · Produzido por Pedro Santos · Interfaces Web</p>
      <a href="../index.html" class="botao-voltar">
        Voltar à página principal
      </a>
    </footer>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
