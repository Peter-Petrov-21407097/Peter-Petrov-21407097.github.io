<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja</h1>

      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>
        <div id="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Cesto de compras</h2>
        <p>Produtos no cesto: <span id="total-cesto">0</span></p>
        <ul id="lista-cesto"></ul>
        <p>Total: <strong id="preco-total">0,00 €</strong></p>
        <button id="limpar-cesto" type="button">Limpar cesto</button>
      </section>
    </main>

    <footer>
      <p>Loja Online — Lab 7 - Criado por Pedro Santos</p>
    </footer>

    <script src="main.js"></script>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
